<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adam Palička – všechno nejlepší k 21. narozeninám</title>
<meta name="description" content="Adam Palička má 16. 10. narozeniny! MLG narozeninová stránka k jeho 21. narozeninám s odpočtem do dalších.">
<link rel="canonical" href="https://cernik.github.io/adampalickanarozeniny/">
<meta property="og:title" content="Adam Palička – 21. narozeniny">
<meta property="og:description" content="Všechno nejlepší, Adame! Odpočet do dalších narozenin.">
<meta property="og:image" content="https://cernik.github.io/adampalickanarozeniny/adam_gym.png">
<meta property="og:url" content="https://cernik.github.io/adampalickanarozeniny/">
<meta property="og:type" content="website">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&display=swap">
<style>
/* Layout: one chaotic stage — Adam huge in the middle, stickers orbiting, countdown HUD below. Single dark MLG look by choice. */
:root{
  --bg:#07040f; --fg:#ffffff; --hot:#ff1fa8; --dew:#7bff00; --dorito:#ff8a00; --sky:#00e5ff; --gold:#ffe600;
  --display:"Anton", Impact, "Arial Narrow Bold", sans-serif;
  --hud:"Bungee", Impact, "Arial Black", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--hud);overflow-x:hidden;margin:0}
*{box-sizing:border-box}

#bg{position:fixed;inset:0;z-index:0;
  background:
    repeating-conic-gradient(from 0deg at 50% 45%, #1a0633 0 10deg, #07040f 10deg 20deg);
}
body.mlg #bg{animation:spin 6s linear infinite, hue 2s linear infinite}
#flash{position:fixed;inset:0;z-index:1;pointer-events:none;background:var(--fg);opacity:0}
body.mlg #flash{animation:flash .375s steps(1) infinite}

.wrap{position:relative;z-index:2;min-height:100%;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 48px;
  display:flex;flex-direction:column;align-items:center;gap:18px}

h1{font-family:var(--display);font-weight:400;margin:0;text-align:center;line-height:.9;
  font-size:clamp(44px, 13vw, 150px);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance;
  color:var(--gold);
  text-shadow:4px 4px 0 var(--hot), -4px -4px 0 var(--sky), 0 0 30px var(--hot)}
h1 small{display:block;font-size:.42em;color:var(--fg);text-shadow:3px 3px 0 #000}
body.mlg h1{animation:wobble .75s ease-in-out infinite}

.stage{position:relative;width:min(100%, 900px);display:grid;place-items:center}
.adam{position:relative;width:min(100%, 820px)}
.adam img{display:block;width:100%;height:auto;filter:drop-shadow(0 0 18px var(--hot)) drop-shadow(0 0 2px #fff)}
body.mlg .adam{animation:bass .375s ease-out infinite}
.shades{position:absolute;left:44.4%;top:11.2%;width:12.4%;transform:translateY(-1200%);opacity:0;pointer-events:none}
body.mlg .shades{animation:deal 1.4s .6s cubic-bezier(.3,1.6,.6,1) forwards}

.sticker{position:absolute;z-index:3;border:4px solid var(--fg);box-shadow:0 0 0 4px #000, 0 0 30px var(--dew);background:#000}
.beach{width:min(36%, 300px);left:-2%;bottom:-6%;transform:rotate(-9deg)}
.beach img{display:block;width:100%}
.dance{width:min(30%, 230px);right:-2%;bottom:-6%;transform:rotate(8deg);box-shadow:0 0 0 4px #000, 0 0 30px var(--hot)}
.dance video{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}
.tag{position:absolute;left:50%;top:-14px;transform:translateX(-50%);white-space:nowrap;
  background:var(--gold);color:#000;font-size:12px;padding:3px 8px;border:2px solid #000}
body.mlg .beach{animation:floatL 1.5s ease-in-out infinite}
body.mlg .dance{animation:floatR 1.5s ease-in-out infinite}

.hud{width:min(100%, 820px);border:4px solid var(--dew);background:rgba(0,0,0,.78);
  padding:16px 14px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;
  box-shadow:0 0 0 4px #000, 0 0 40px rgba(123,255,0,.45);margin-top:28px}
.hud .label{font-size:clamp(12px, 3.2vw, 16px);letter-spacing:.12em;color:var(--dew);text-align:center}
.count{display:grid;grid-template-columns:repeat(5, minmax(0,1fr));gap:8px;width:100%}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cell b{font-family:var(--display);font-weight:400;font-size:clamp(30px, 9vw, 72px);line-height:1;
  font-variant-numeric:tabular-nums;color:var(--fg);text-shadow:3px 3px 0 var(--hot)}
.cell span{font-size:clamp(9px, 2.4vw, 13px);letter-spacing:.08em;color:var(--sky)}
.xp{width:100%;height:18px;border:3px solid var(--fg);background:#000;position:relative}
.xp i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--dew) 0 12px,#3bbf00 12px 24px)}
.xp em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:11px;color:#000;mix-blend-mode:normal;text-shadow:0 0 3px #fff}

.wish{width:min(100%, 820px);font-family:var(--hud);text-align:center;font-size:clamp(14px, 3.6vw, 20px);line-height:1.5;
  background:var(--hot);color:#000;padding:14px 16px;border:4px solid #000;transform:rotate(-1deg)}

.song{font-size:12px;color:var(--fg);opacity:.85;text-align:center}
.song a{color:var(--gold)}

/* chaos layer */
#fx{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.pop{position:absolute;font-family:var(--display);text-transform:uppercase;white-space:nowrap;
  -webkit-text-stroke:2px #000;paint-order:stroke fill;animation:pop 1.1s ease-out forwards}
.emo{position:absolute;font-size:56px;animation:fly 1.6s linear forwards}
.hit{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;animation:hit .35s ease-out forwards}
.hit::before,.hit::after{content:"";position:absolute;left:50%;top:50%;width:52px;height:4px;margin:-2px 0 0 -26px;
  background:linear-gradient(90deg,#fff 0 38%,transparent 38% 62%,#fff 62%)}
.hit::before{transform:rotate(45deg)}.hit::after{transform:rotate(-45deg)}

#gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(7,4,15,.55);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#go{font-family:var(--display);font-size:clamp(30px, 9vw, 64px);text-transform:uppercase;cursor:pointer;
  background:var(--gold);color:#000;border:6px solid #000;padding:14px 28px;box-shadow:8px 8px 0 var(--hot);
  animation:pulse .75s ease-in-out infinite}
#go:focus-visible{outline:4px solid var(--sky);outline-offset:6px}
#go small{display:block;font-family:var(--hud);font-size:.3em;letter-spacing:.1em}

#mute{position:fixed;z-index:11;right:calc(12px + env(safe-area-inset-right, 0px));bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  font-family:var(--hud);font-size:13px;background:#000;color:var(--fg);border:3px solid var(--fg);padding:8px 12px;cursor:pointer}
#mute:focus-visible{outline:3px solid var(--gold)}

@keyframes spin{to{transform:rotate(360deg) scale(1.6)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes flash{0%{opacity:.07}50%{opacity:0}}
@keyframes wobble{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.06)}}
@keyframes bass{0%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes deal{0%{transform:translateY(-1200%);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes floatL{0%,100%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(-14deg) translateY(-12px)}}
@keyframes floatR{0%,100%{transform:rotate(8deg) translateY(0)}50%{transform:rotate(13deg) translateY(-12px)}}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(var(--r));opacity:1}60%{transform:translate(-50%,-50%) scale(1.15) rotate(var(--r));opacity:1}100%{transform:translate(-50%,-50%) scale(1.3) rotate(var(--r));opacity:0}}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:.2}}
@keyframes hit{0%{transform:scale(1.4);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes pulse{50%{transform:scale(1.08) rotate(-2deg)}}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-8px,5px)}50%{transform:translate(7px,-6px)}75%{transform:translate(-5px,-4px)}}
body.shake .wrap{animation:shake .25s linear 2}

@media (prefers-reduced-motion: reduce){
  body.mlg #bg,body.mlg #flash,body.mlg h1,body.mlg .adam,body.mlg .beach,body.mlg .dance,#go{animation:none}
  body.mlg .shades{animation:none;transform:none;opacity:1}
  .pop,.emo{animation-duration:.01s}
}
@media (max-width:560px){
  .beach{width:42%;bottom:-14%}
  .dance{width:36%;bottom:-14%}
  .hud{margin-top:52px}
}
</style>

<div id="bg"></div>
<div id="flash"></div>

<main class="wrap">
  <h1><small>Všechno nejlepší</small>Adam Palička</h1>

  <div class="stage">
    <div class="adam">
      <img src="adam_gym.png" alt="Adam u zrcadla v posilovně, ruce od těla">
      <svg class="shades" viewBox="0 0 16 4" shape-rendering="crispEdges" aria-hidden="true">
        <rect x="0" y="0" width="16" height="1" fill="#000"/>
        <rect x="1" y="1" width="6" height="2" fill="#000"/><rect x="9" y="1" width="6" height="2" fill="#000"/>
        <rect x="2" y="3" width="4" height="1" fill="#000"/><rect x="10" y="3" width="4" height="1" fill="#000"/>
        <rect x="2" y="1" width="1" height="1" fill="#fff"/><rect x="3" y="2" width="1" height="1" fill="#fff"/>
        <rect x="10" y="1" width="1" height="1" fill="#fff"/><rect x="11" y="2" width="1" height="1" fill="#fff"/>
      </svg>
    </div>
    <figure class="sticker beach" style="margin:0">
      <span class="tag">PLÁŽOVÝ MÓD</span>
      <img src="adam_beach.jpg" alt="Adam na pláži v kšiltovce a brýlích, za ním jeho přítelkyně">
    </figure>
    <figure class="sticker dance" style="margin:0">
      <span class="tag">TANEČNÍ MÓD</span>
      <video id="dance" src="dance.mp4" loop playsinline muted preload="auto"></video>
    </figure>
  </div>

  <section class="hud" aria-live="off">
    <div class="label" id="lvl">LEVEL 21 ODEMČEN · DALŠÍ LEVEL ZA</div>
    <div class="count">
      <div class="cell"><b id="d">365</b><span>DNÍ</span></div>
      <div class="cell"><b id="h">00</b><span>HODIN</span></div>
      <div class="cell"><b id="m">00</b><span>MINUT</span></div>
      <div class="cell"><b id="s">00</b><span>SEKUND</span></div>
      <div class="cell"><b id="ms">000</b><span>MS</span></div>
    </div>
    <div class="xp"><i id="xpbar" style="width:0%"></i><em id="xptxt">XP 0 %</em></div>
    <div class="label">16. 10. 2027 · LEVEL 22</div>
  </section>

  <p class="wish">GG Adame! 21 let, nula lagu, 360 no scope na každej den. Všechno nejlepší!</p>
  <p class="song">Hraje: Ely Oaks – Impossible · <a href="https://www.youtube.com/results?search_query=Ely+Oaks+Impossible" target="_blank" rel="noopener">celá písnička</a></p>
</main>

<div id="fx"></div>
<div id="gate"><button id="go" type="button">Spustit MLG<small>pusť si zvuk 🔊</small></button></div>
<button id="mute" type="button" hidden>🔊 ZVUK</button>

<script>
(() => {
  // Birthday: 16 Oct, born 2005
  const BM = 9, BD = 16, BY = 2005;
  const $ = id => document.getElementById(id);
  const pad = (n, l = 2) => String(n).padStart(l, "0");

  function nextBirthday(now) {
    let t = new Date(now.getFullYear(), BM, BD);
    if (t <= now) t = new Date(now.getFullYear() + 1, BM, BD);
    return t;
  }
  function tick() {
    const now = new Date();
    const next = nextBirthday(now);
    const prev = new Date(next.getFullYear() - 1, BM, BD);
    const diff = next - now;
    $("d").textContent = Math.floor(diff / 864e5);
    $("h").textContent = pad(Math.floor(diff / 36e5) % 24);
    $("m").textContent = pad(Math.floor(diff / 6e4) % 60);
    $("s").textContent = pad(Math.floor(diff / 1e3) % 60);
    $("ms").textContent = pad(diff % 1000, 3);
    const pct = ((now - prev) / (next - prev)) * 100;
    $("xpbar").style.width = pct.toFixed(3) + "%";
    $("xptxt").textContent = "XP " + pct.toFixed(4) + " %";
    const age = prev.getFullYear() - BY;
    const today = now.getMonth() === BM && now.getDate() === BD;
    $("lvl").textContent = today ? `DNESKA! LEVEL ${age} ODEMČEN · DALŠÍ ZA` : `LEVEL ${age} · DALŠÍ LEVEL ZA`;
    document.querySelector(".hud .label:last-child").textContent =
      `${BD}. ${BM + 1}. ${next.getFullYear()} · LEVEL ${age + 1}`;
    requestAnimationFrame(tick);
  }
  tick();

  // ---- MLG chaos ----
  const fx = $("fx");
  const words = ["WOW", "360 NO SCOPE", "GET REKT", "OH BABY A TRIPLE", "21 KILLSTREAK", "MOM GET THE CAMERA", "SIGMA", "ADAM GOD", "+21 XP", "WOMBO COMBO", "ILLUMINATI"];
  const colors = ["var(--gold)", "var(--dew)", "var(--hot)", "var(--sky)", "var(--dorito)", "#fff"];
  const emojis = ["🔥", "💯", "🎂", "🕶️", "👌", "💪", "🎉", "🔺", "😂", "🏆"];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function pop(x, y) {
    const el = document.createElement("div");
    el.className = "pop";
    el.textContent = pick(words);
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.color = pick(colors);
    el.style.fontSize = rnd(28, 72) + "px";
    el.style.setProperty("--r", rnd(-25, 25) + "deg");
    fx.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
  function emo() {
    const el = document.createElement("div");
    el.className = "emo";
    el.textContent = pick(emojis);
    const fromLeft = Math.random() < .5;
    el.style.left = (fromLeft ? -60 : innerWidth + 10) + "px";
    el.style.top = rnd(0, innerHeight) + "px";
    el.style.setProperty("--dx", (fromLeft ? 1 : -1) * (innerWidth + 120) + "px");
    el.style.setProperty("--dy", rnd(-300, 300) + "px");
    fx.appendChild(el);
    setTimeout(() => el.remove(), 1700);
  }
  function hit(x, y) {
    const el = document.createElement("div");
    el.className = "hit";
    el.style.left = x + "px"; el.style.top = y + "px";
    fx.appendChild(el);
    setTimeout(() => el.remove(), 400);
  }

  // ---- synthesized sounds (no samples) ----
  let ac = null, master = null, muted = false;
  function audio() {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = .35; master.connect(ac.destination);
    }
    return ac;
  }
  function airhorn() {
    if (muted || !ac) return;
    const t = ac.currentTime, g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.5, t + .02);
    g.gain.setValueAtTime(.5, t + .55);
    g.gain.linearRampToValueAtTime(0, t + .7);
    g.connect(master);
    [440, 443, 554, 660].forEach(f => {
      const o = ac.createOscillator();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(f * .94, t);
      o.frequency.linearRampToValueAtTime(f, t + .06);
      o.connect(g); o.start(t); o.stop(t + .72);
    });
  }
  function hitSound() {
    if (muted || !ac) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = "square"; o.frequency.setValueAtTime(2400, t); o.frequency.exponentialRampToValueAtTime(900, t + .05);
    g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + .07);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .08);
  }

  function shake() {
    document.body.classList.remove("shake"); void document.body.offsetWidth; document.body.classList.add("shake");
  }

  const video = $("dance");
  function start() {
    $("gate").hidden = true;
    $("mute").hidden = false;
    document.body.classList.add("mlg");
    audio(); ac.resume && ac.resume();
    video.muted = false; video.currentTime = 0;
    video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
    airhorn(); setTimeout(airhorn, 350); setTimeout(airhorn, 700);
    if (reduce) return;
    let n = 0;
    setInterval(() => {
      n++;
      pop(rnd(.1, .9) * innerWidth, rnd(.1, .9) * innerHeight);
      if (n % 2 === 0) emo();
      if (n % 8 === 0) { airhorn(); shake(); }
    }, 375);
  }
  $("go").addEventListener("click", start);
  video.play().catch(() => {}); // muted preview before the gate is clicked

  document.addEventListener("pointerdown", e => {
    if (e.target.closest("button, a")) return;
    if (!document.body.classList.contains("mlg")) return;
    hit(e.clientX, e.clientY); hitSound();
    if (Math.random() < .4) pop(e.clientX, e.clientY - 40);
  });

  $("mute").addEventListener("click", () => {
    muted = !muted;
    video.muted = muted;
    $("mute").textContent = muted ? "🔇 ZTLUMENO" : "🔊 ZVUK";
  });
})();
</script>

</body>
</html>
